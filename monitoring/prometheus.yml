# Prometheus local: faz scrape da API de inferência e do Pushgateway (drift) e carrega as regras de alerta.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: serving
    metrics_path: /metrics
    static_configs:
      - targets: ["serving:8000"]

  # Resumo de drift, publicado pelo job em lote (DAG `monitoring`). honor_labels: os rótulos
  # `job`/`instance` são os do job que fez o push, não os do Pushgateway.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
