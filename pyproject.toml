[project]
name = "the-bank-project"
version = "0.1.0"
description = "Pipeline de ML ponta a ponta sobre o dataset Berka (Kaggle): datalake local, feature store, treino/comparação/tuning de modelos, deploy via API e monitoramento de drift."
authors = [{ name = "TheElectron" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.poetry]
# Aplicação (roda via `python -m src...`), não uma lib publicada — sem
# pacote a instalar/distribuir, só gestão de dependências.
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
kaggle = ">=1.6.0"
pandas = ">=2.0.0"
pyarrow = ">=14.0.0"
pydantic = ">=2.7.0"
pyyaml = ">=6.0.0"
python-dotenv = ">=1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
ruff = ">=0.6.0"
mypy = ">=1.11.0"
notebook = ">=7.0.0"
ipykernel = ">=6.29.0"
matplotlib = ">=3.8.0"
seaborn = ">=0.13.0"
types-pyyaml = ">=6.0.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Garante que `src` (pacote na raiz do repo, sem instalação editável) seja
# importável dos testes independente de quão fundo `tests/` esteja aninhado
# — troca o antigo shim manual de `sys.path` em `tests/conftest.py`.
pythonpath = ["."]

[tool.ruff]
line-length = 160
target-version = "py312"
# notebooks/ é só exploração pontual (ver CLAUDE.md, "Estrutura do
# projeto") — não é dependência de produção, não vale a pena lintar.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
