[project]
name = "the-bank-project"
version = "0.1.0"
description = "Pipeline de ML ponta a ponta sobre o Berka Dataset: data lake Medallion, feature store, modelos, serving via API e monitoramento."
authors = [{ name = "TheElectron" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kaggle>=1.6.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.0",
]

# Airflow NÃO entra aqui: roda em imagem própria (docker/airflow/) com os
# constraints oficiais, para não conflitar com Feast/MLflow/Evidently.
# Os grupos `ml` (Feast, MLflow, scikit-learn, XGBoost, Evidently) e `serving`
# (FastAPI, Prometheus client) são adicionados nas fases 4-7 do ROADMAP.

[tool.poetry]
packages = [{ include = "the_bank_project", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=5.0.0"
ruff = ">=0.6.0"
mypy = ">=1.11.0"
pre-commit = ">=3.7.0"
types-pyyaml = ">=6.0.0"
ipykernel = ">=6.29.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["the_bank_project"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
