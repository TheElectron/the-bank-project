[project]
name = "the-bank-project"
version = "0.1.0"
description = "Pipeline de ML ponta a ponta sobre o Berka Dataset: data lake Medallion, feature store, modelos, serving via API e monitoramento."
authors = [{ name = "TheElectron" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "feast>=0.60.0",
    "kaggle>=1.6.0",
    "mlflow>=3.10,<4",
    "pandas>=2.2.0,<3",
    "prometheus-client>=0.20",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.6,<2",
    "uvicorn>=0.30",
    "xgboost-cpu>=3.0,<4",
]

# Airflow NÃO entra aqui: roda em imagem própria (docker/airflow/) com os
# constraints oficiais, para não conflitar com Feast/MLflow/Evidently. Tudo o mais
# (ingestão, Feast, treino e serving) é dependência principal: as imagens da API e do
# venv do Airflow instalam pelo poetry.lock, então as versões são as mesmas em todo lugar.
# Evidently (Fase 7) entra aqui quando o monitoramento for implementado.

[tool.poetry]
packages = [{ include = "the_bank_project", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
httpx = ">=0.27"
pytest-cov = ">=5.0.0"
ruff = ">=0.6.0"
mypy = ">=1.11.0"
pre-commit = ">=3.7.0"
types-pyyaml = ">=6.0.0"
ipykernel = ">=6.29.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Ruídos internos do Feast/Dask (não são do nosso código).
    "ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning",
    "ignore:Merging dataframes with merge column data type mismatches:UserWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["the_bank_project"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
