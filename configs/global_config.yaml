# Parâmetros gerais do projeto. Carregado por `the_bank_project.config.load_config`
# (validado via Pydantic). Caminhos relativos são resolvidos a partir da raiz do repo.
paths:
  data_dir: data          # subpastas raw/ bronze/ silver/ gold/ (ver ROADMAP, Fase 0)

kaggle:
  dataset: marceloventura/the-berka-dataset

feast:
  repo_path: feature_repo   # feature_store.yaml + features.py (Fase 4)

training:
  experiment: regressao_outflow
  registered_model: outflow_regression
  feature_service: outflow_regression
  split: {train_frac: 0.70, val_frac: 0.20, gap_months: 1}
  n_tuning_trials: 8
  log_target: true
  seed: 42

serving:
  port: 8000
  max_batch: 100
  model_poll_seconds: 60
  history_months: 12

monitoring:
  current_months: 3            # janela "atual" do drift: os N últimos meses da Gold
  feature_threshold: 0.1       # Wasserstein normalizada pelo desvio da referência, por feature
  drift_share_threshold: 0.5   # fração de features com drift a partir da qual há drift no dataset
  retrain_enabled: true        # se false, o drift nunca dispara o re-treino
  retrain_cooldown_days: 14    # intervalo mínimo entre re-treinos disparados por drift
