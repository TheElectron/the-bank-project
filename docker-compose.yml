# Infra local (100% Docker). Cresce a cada fase; Airflow (Fase 1b; roda também o Feast, Fase 4), MLflow (Fase 5) e a API de inferência (Fase 6).
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: the-bank-project-airflow:latest
  # UID do host, para os arquivos gravados em data/ não virarem do root.
  user: "${AIRFLOW_UID:-50000}:0"
  env_file:
    - path: .env
      required: false
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    # Só local: sem tela de login.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API_AUTH__JWT_SECRET: local-dev-only-jwt-secret-change-me-32b
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./configs:/opt/airflow/configs
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./feature_repo:/opt/airflow/feature_repo
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    image: the-bank-project-mlflow:latest
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  serving:
    build:
      context: .
      dockerfile: docker/serving/Dockerfile
    image: the-bank-project-serving:latest
    # UID do host: o Feast abre (e o SQLite trava) arquivos em feature_repo/data, que o Airflow também escreve.
    user: "${AIRFLOW_UID:-1000}:0"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      HOME: /tmp
    volumes:
      - ./feature_repo:/app/feature_repo
      - ./data/gold:/app/data/gold:ro
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  mlflow-data:
  postgres-data:
  airflow-logs:
