# Infra local (100% Docker). Cresce a cada fase; Airflow (Fase 1b; roda também o Feast, Fase 4), MLflow (Fase 5), a API de inferência (Fase 6) Prometheus + Pushgateway + Grafana (Fase 7).
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: the-bank-project-airflow:latest
  # UID do host, para os arquivos gravados em data/ não virarem do root.
  user: "${AIRFLOW_UID:-50000}:0"
  env_file:
    - path: .env
      required: false
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    # Só local: sem tela de login.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API_AUTH__JWT_SECRET: local-dev-only-jwt-secret-change-me-32b
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    MLFLOW_TRACKING_URI: http://mlflow:5000
    PUSHGATEWAY_URL: http://pushgateway:9091
    DO_NOT_TRACK: "1"  # sem telemetria de uso do Evidently
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./configs:/opt/airflow/configs
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./feature_repo:/opt/airflow/feature_repo
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    image: the-bank-project-mlflow:latest
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  serving:
    build:
      context: .
      dockerfile: docker/serving/Dockerfile
    image: the-bank-project-serving:latest
    # UID do host: o Feast abre (e o SQLite trava) arquivos em feature_repo/data, que o Airflow também escreve.
    user: "${AIRFLOW_UID:-1000}:0"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      HOME: /tmp
    volumes:
      - ./feature_repo:/app/feature_repo
      - ./data/gold:/app/data/gold:ro
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  pushgateway:
    image: prom/pushgateway:v1.11.1
    # Persistência em volume: o resumo de drift sobrevive a um restart (o job só roda de tempos em tempos).
    command:
      - --persistence.file=/data/metrics.db
      - --persistence.interval=1m
    volumes:
      - pushgateway-data:/data
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - serving
      - pushgateway

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # Só local: dashboards visíveis sem login (admin/admin para editar).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  mlflow-data:
  postgres-data:
  airflow-logs:
  pushgateway-data:
  prometheus-data:
  grafana-data:
